name: nexusride
description: App de seguridad para ciclistas con módulo GPS en casco
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.18.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^17.5.0

  # Mapas GPS
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1

  # Bluetooth
  flutter_blue_plus: ^1.36.8

  # Notificaciones push
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Servicio de fondo BLE
  flutter_background_service: ^5.0.5

  # Almacenamiento local
  flutter_secure_storage: ^10.3.4
  hive_ce_flutter: ^2.4.0
  hive_ce: ^2.20.1

  # Conectividad
  connectivity_plus: ^7.3.1

  # Permisos
  permission_handler: ^12.0.3

  # Utilidades
  share_plus: ^13.3.0
  flutter_native_splash: ^2.4.8
  google_fonts: ^6.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  hive_ce_generator: ^1.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
